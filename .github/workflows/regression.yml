name: Beta 15 regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Repository sanity and whitespace
        shell: bash
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f tools/serve_local.py
          test -f v6-beta15.html
          git diff --check HEAD^ HEAD

      - name: Syntax checks
        run: |
          node --check tests/browser-regression.cjs
          node --check tests/static-regression.test.cjs
          python -m py_compile tools/serve_local.py tests/test_local_server.py

      - name: Static, server and browser regression tests
        run: npm test
