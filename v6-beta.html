<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Кино-менеджер v6 Beta 1</title>
<style>
:root{--bg:#07090c;--panel:#0f1318;--panel2:#141a20;--line:#252d35;--text:#f5f5f2;--muted:#99a3ad;--gold:#dfa52f;--gold2:#f2bc4f;--green:#6dbb6e;--danger:#de786e;--max:1450px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(1000px 560px at 78% -12%,rgba(223,165,47,.11),transparent 55%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.hidden{display:none!important}.app{max-width:var(--max);margin:auto;padding:22px 24px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.brand{font-size:23px;font-weight:800;display:flex;gap:9px;align-items:center}.brand small{color:var(--muted);font-size:14px;font-weight:500}.top-tools{display:flex;gap:10px}.icon{width:45px;height:45px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.hero{display:grid;grid-template-columns:1fr auto;align-items:start;gap:18px}.hero h1{font-size:clamp(30px,4vw,50px);margin:0 0 8px}.hero p{margin:0;color:var(--muted);font-size:18px}.random{background:linear-gradient(180deg,#161b21,#0e1217);color:var(--gold2);border:1px solid var(--line);padding:17px 22px;border-radius:18px;font-weight:800}
.search-wrap{margin:26px 0 16px;display:grid;grid-template-columns:1fr auto;border:1px solid var(--line);background:var(--panel);border-radius:18px;overflow:hidden}.search-wrap input{border:0;background:transparent;color:var(--text);padding:18px 20px;outline:0}.filter-open{border:0;border-left:1px solid var(--line);background:transparent;color:var(--gold2);padding:0 22px}
.filter-panel{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px}.chip.active{background:var(--gold);border-color:var(--gold);color:#141414;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0 30px}.stat{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#0c1014);border-radius:18px;padding:18px}.stat b{display:block}.stat strong{display:block;color:var(--gold2);font-size:35px;margin:10px 0 2px}.stat span{color:var(--muted);font-size:14px}
.section{margin-top:28px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section h2{margin:0;font-size:24px}.ghost{background:none;border:0;color:var(--gold2)}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:180px;gap:13px;overflow-x:auto;padding:2px 1px 8px;scroll-snap-type:x mandatory}.media-card{scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;min-width:0;position:relative}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#2c3238,#101317);display:flex;align-items:end;padding:12px;font-size:17px;font-weight:800;background-size:cover;background-position:center}.poster::after{content:"";position:absolute;inset:0 0 auto 0;aspect-ratio:2/3;background:linear-gradient(180deg,transparent 53%,rgba(0,0,0,.92));pointer-events:none}.poster-title{position:relative;z-index:1}.card-info{padding:10px 12px 13px}.card-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-info span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.card-info .r{color:var(--gold2)}
.list-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}.list-head .count{color:var(--muted)}.list-grid{display:grid;gap:10px;margin-top:14px}.row{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#0c1014);border-radius:18px;padding:10px}.row-poster{width:82px;aspect-ratio:2/3;border-radius:11px;background:#191d21 center/cover}.row h3{margin:0 0 4px;font-size:19px}.row-meta{color:var(--muted);font-size:13px}.row-desc{color:var(--muted);font-size:13px;line-height:1.4;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.row-actions{display:flex;align-items:center;gap:7px}.small-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px}.small-btn.gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:800}.small-btn.on{color:var(--gold2);border-color:#75581e}.rating{color:var(--gold2);font-weight:800;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:50px 20px}.sentinel{text-align:center;color:var(--muted);padding:15px}.status{margin-top:10px;color:var(--muted);font-size:12px}
.nav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 18px));display:grid;grid-template-columns:repeat(5,1fr);padding:8px;background:rgba(14,18,23,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;z-index:20}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:14px;display:grid;place-items:center;gap:3px}.nav button.active{color:var(--gold2);background:rgba(223,165,47,.08)}.nav small{font-size:10px}.nav .plus{width:50px;height:50px;margin:-16px auto 0;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#111;font-size:26px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(650px,100%);max-height:88vh;overflow:auto;background:#10151a;border:1px solid var(--line);border-radius:24px;padding:20px}.modal h2{margin:0 0 14px}.modal input,.modal select{width:100%;background:#0b0f13;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.result{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:13px;margin-top:8px}.result-poster{width:60px;aspect-ratio:2/3;background:#222 center/cover;border-radius:8px}.result small{color:var(--muted)}.close{float:right}
.desktop-side{display:none}
@media(max-width:720px){.app{padding:18px 14px 110px}.hero{grid-template-columns:1fr}.random{width:100%}.stats{grid-template-columns:1fr 1fr}.stat{padding:14px}.carousel{grid-auto-columns:42%}.row{grid-template-columns:65px 1fr}.row-poster{width:65px}.row-actions{grid-column:1/-1;justify-content:flex-end}.filter-open{padding:0 13px}}
@media(min-width:1100px){body{padding-left:88px}.desktop-side{display:flex;position:fixed;left:13px;top:50%;transform:translateY(-50%);width:64px;flex-direction:column;gap:8px;padding:8px;background:rgba(14,18,23,.94);border:1px solid var(--line);border-radius:21px;z-index:30}.desktop-side button{height:50px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:20px}.desktop-side button.active{color:var(--gold2);background:rgba(223,165,47,.09)}.nav{display:none}.app{padding-bottom:40px}.carousel{grid-auto-columns:190px}}
@media(min-width:1700px){:root{--max:1650px}.app{padding-top:38px}.brand{font-size:29px}.hero h1{font-size:60px}.hero p{font-size:22px}.search-wrap input{font-size:20px;padding:22px}.filter-open{font-size:20px}.stat{padding:24px}.stat b{font-size:19px}.stat strong{font-size:48px}.stat span{font-size:17px}.section h2{font-size:31px}.carousel{grid-auto-columns:240px}.row{grid-template-columns:105px 1fr auto;padding:14px}.row-poster{width:105px}.row h3{font-size:25px}.row-meta,.row-desc{font-size:17px}.small-btn{font-size:18px;padding:14px 17px}}
@media(min-width:1600px) and (pointer:coarse){button,.chip{font-size:20px}.desktop-side{width:90px}.desktop-side button{height:70px;font-size:28px}.carousel{grid-auto-columns:260px}.row{min-height:155px}}
</style>
</head>
<body>
<aside class="desktop-side"><button class="active">⌂</button><button>☷</button><button id="deskAdd">＋</button><button>⌕</button><button>◉</button></aside>
<main class="app">
<header class="top"><div class="brand">🎬 Кино-менеджер <small>v6 Beta 1</small></div><div class="top-tools"><button class="icon" id="topSearch">⌕</button><button class="icon" id="profileBtn">A</button></div></header>
<section class="hero"><div><h1>Добрый вечер! 👋</h1><p id="heroCount">Загружаю ваш список…</p></div><button class="random" id="randomBtn">🎲 Что посмотреть?　›</button></section>
<div class="search-wrap"><input id="search" placeholder="Поиск по названию, описанию, жанру…"><button class="filter-open" id="filterOpen">☷ Фильтры</button></div>
<div class="filter-panel" id="filters">
 <button class="chip active" data-type="all">Все</button><button class="chip" data-type="M">Фильмы</button><button class="chip" data-type="S">Сериалы</button>
 <button class="chip" data-state="unwatched">Не просмотрено</button><button class="chip" data-state="watched">Просмотрено</button><button class="chip" data-state="favorite">Избранное</button>
</div>
<section class="stats"><article class="stat"><b>🔖 В избранном</b><strong id="favNum">0</strong><span>позиций</span></article><article class="stat"><b>🌆 Сегодня вечером</b><strong id="tonightNum">0</strong><span>в плане</span></article><article class="stat"><b>🏆 Средний рейтинг</b><strong id="avgNum">—</strong><span>TMDB / список</span></article><article class="stat"><b>✓ Просмотрено</b><strong id="watchedNum">0</strong><span id="watchedSub">из 0</span></article></section>
<section class="section" id="continueSection"><div class="section-head"><h2>В избранном</h2><button class="ghost" data-scroll="list">Все ›</button></div><div class="carousel" id="favoritesCarousel"></div></section>
<section class="section"><div class="section-head"><h2>Высокий рейтинг</h2><button class="ghost" id="ratingFilter">Все ›</button></div><div class="carousel" id="topCarousel"></div></section>
<section class="section" id="listSection"><div class="list-head"><div><h2>Мой список</h2><div class="count" id="resultCount"></div></div><select id="sort" class="chip"><option value="rating">По рейтингу</option><option value="title">По названию</option><option value="year">По году</option></select></div><div class="list-grid" id="list"></div><div class="sentinel" id="sentinel"></div></section>
<div class="status" id="status"></div>
</main>
<nav class="nav"><button class="active" data-nav="home">⌂<small>Главная</small></button><button data-nav="list">☷<small>Мой список</small></button><button id="addBtn"><span class="plus">＋</span><small>Добавить</small></button><button id="searchBtn">⌕<small>Поиск</small></button><button id="mobileProfile">◉<small>Профиль</small></button></nav>
<div class="modal-bg hidden" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
const BASE_URLS=[
 'https://raw.githubusercontent.com/aganunu/watchlist/60a72abc567dd3b95c4cbd21d5b960a78e2b6c5f/index.html',
 'https://cdn.jsdelivr.net/gh/aganunu/watchlist@60a72abc567dd3b95c4cbd21d5b960a78e2b6c5f/index.html'
];
const STORAGE_KEY='watchlist_v3',TOKEN_KEY='watchlist_tmdb_key';
let BASE={movies:[],series:[]},state={},items=[],filtered=[],renderLimit=30,typeFilter='all',stateFilter='all',query='',sortMode='rating';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').normalize('NFKC');
const idFor=it=>(it.type||'M')+'::'+it.title+'::'+(it.year||'');
function loadState(){try{state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){state={}};state.watched=state.watched||[];state.pins=state.pins||[];state.addedItems=state.addedItems||[];state.tmdbMeta=state.tmdbMeta||{};state.ratings=state.ratings||{};state.notes=state.notes||{}}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
async function fetchBase(){for(const u of BASE_URLS){try{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)continue;const t=await r.text();const m=t.match(/const DATA = (\{[\s\S]*?\});\nconst GENRE_COLORS/);if(m)return JSON.parse(m[1])}catch(e){console.warn(e)}}throw new Error('Не удалось загрузить базовый список')}
function mergedItem(it){return Object.assign({},it,state.tmdbMeta[idFor(it)]||{})}
function rebuild(){items=[...BASE.movies,...BASE.series,...state.addedItems].map(mergedItem);const seen=new Set();items=items.filter(it=>{const id=idFor(it);if(seen.has(id))return false;seen.add(id);return true});applyFilters();updateStats();renderCarousels()}
function ratingOf(it){return it.tmdb_rating??it.rating??null}
function posterOf(it){return it.poster_url||''}
function isWatched(it){return state.watched.includes(idFor(it))}
function isFav(it){return state.pins.includes(idFor(it))}
function applyFilters(){const n=norm(query.trim());filtered=items.filter(it=>{if(typeFilter!=='all'&&it.type!==typeFilter)return false;if(stateFilter==='watched'&&!isWatched(it))return false;if(stateFilter==='unwatched'&&isWatched(it))return false;if(stateFilter==='favorite'&&!isFav(it))return false;if(n&&!norm([it.title,it.desc||'',...(it.genres||[])].join(' ')).includes(n))return false;return true});filtered.sort((a,b)=>sortMode==='title'?a.title.localeCompare(b.title,'ru'):sortMode==='year'?(b.year||0)-(a.year||0):(ratingOf(b)||0)-(ratingOf(a)||0));renderLimit=30;renderList()}
function cardHTML(it){const p=posterOf(it),r=ratingOf(it);return `<article class="media-card" tabindex="0" data-id="${esc(idFor(it))}"><div class="poster" style="${p?`background-image:url('${esc(p)}')`:''}"><span class="poster-title">${esc(it.title)}</span></div><div class="card-info"><b>${esc(it.title)}</b><span>${it.year||'—'} · ${it.type==='M'?'Фильм':'Сериал'}</span><span class="r">${r!=null?'★ '+Number(r).toFixed(1):'★ —'}</span></div></article>`}
function renderCarousels(){const fav=items.filter(isFav).slice(0,12),top=[...items].filter(x=>ratingOf(x)!=null).sort((a,b)=>ratingOf(b)-ratingOf(a)).slice(0,12);$('#favoritesCarousel').innerHTML=fav.length?fav.map(cardHTML).join(''):'<div class="empty">Добавляйте фильмы и сериалы в избранное ⭐</div>';$('#topCarousel').innerHTML=top.map(cardHTML).join('')}
function renderList(){const show=filtered.slice(0,renderLimit);$('#resultCount').textContent=`Найдено: ${filtered.length}`;$('#list').innerHTML=show.length?show.map(it=>{const p=posterOf(it),r=ratingOf(it),id=esc(idFor(it));return `<article class="row" data-id="${id}"><div class="row-poster" style="${p?`background-image:url('${esc(p)}')`:''}"></div><div><h3>${esc(it.title)}</h3><div class="row-meta">${it.year||'Год не указан'} · ${it.type==='M'?'Фильм':'Сериал'} · ${(it.genres||[]).slice(0,3).map(esc).join(', ')}</div><div class="row-desc">${esc(it.desc||'Описание пока отсутствует')}</div></div><div class="row-actions"><span class="rating">${r!=null?'★ '+Number(r).toFixed(1):'★ —'}</span><button class="small-btn fav ${isFav(it)?'on':''}" title="Избранное">${isFav(it)?'★':'☆'}</button><button class="small-btn watched ${isWatched(it)?'on':''}">${isWatched(it)?'✓':'○'}</button><button class="small-btn gold details">Открыть</button></div></article>`}).join(''):'<div class="empty">Ничего не найдено</div>';$('#sentinel').textContent=renderLimit<filtered.length?'Показать ещё':'';
 bindRows()}
function bindRows(){$$('.row .fav').forEach(b=>b.onclick=()=>toggleFav(b.closest('.row').dataset.id));$$('.row .watched').forEach(b=>b.onclick=()=>toggleWatched(b.closest('.row').dataset.id));$$('.row .details').forEach(b=>b.onclick=()=>openDetails(b.closest('.row').dataset.id));$$('.media-card').forEach(c=>c.onclick=()=>openDetails(c.dataset.id))}
function updateStats(){const watched=items.filter(isWatched).length,fav=items.filter(isFav).length,rs=items.map(ratingOf).filter(x=>x!=null);$('#heroCount').textContent=`У вас ${items.length} идей для просмотра`;$('#favNum').textContent=fav;$('#tonightNum').textContent=state.tonightId?1:0;$('#avgNum').textContent=rs.length?(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1):'—';$('#watchedNum').textContent=watched;$('#watchedSub').textContent=`из ${items.length}`;$('#status').textContent=`TMDB: ${Object.keys(state.tmdbMeta||{}).length} карточек в локальном кэше · токен ${localStorage.getItem(TOKEN_KEY)?'сохранён':'не задан'}`}
function byId(id){return items.find(x=>idFor(x)===id)}
function toggleFav(id){state.pins=state.pins||[];state.pins=state.pins.includes(id)?state.pins.filter(x=>x!==id):[...state.pins,id];saveState();rebuild()}
function toggleWatched(id){state.watched=state.watched||[];state.watched=state.watched.includes(id)?state.watched.filter(x=>x!==id):[...state.watched,id];saveState();rebuild()}
function openModal(html){$('#modal').innerHTML=`<button class="small-btn close" onclick="closeModal()">✕</button>${html}`;$('#modalBg').classList.remove('hidden')}
function closeModal(){$('#modalBg').classList.add('hidden')}window.closeModal=closeModal;$('#modalBg').onclick=e=>{if(e.target===$('#modalBg'))closeModal()}
function openDetails(id){const it=byId(id);if(!it)return;const p=posterOf(it),r=ratingOf(it);openModal(`<h2>${esc(it.title)}</h2><div style="display:grid;grid-template-columns:110px 1fr;gap:15px"><div class="row-poster" style="width:110px;${p?`background-image:url('${esc(p)}')`:''}"></div><div><div class="rating">${r!=null?'★ '+Number(r).toFixed(1):'★ —'}</div><p>${esc(it.year||'')} · ${it.type==='M'?'Фильм':'Сериал'}</p><p style="color:var(--muted);line-height:1.5">${esc(it.desc||'')}</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="small-btn ${isFav(it)?'on':''}" onclick="modalFav('${esc(id)}')">${isFav(it)?'★ В избранном':'☆ В избранное'}</button><button class="small-btn ${isWatched(it)?'on':''}" onclick="modalWatched('${esc(id)}')">${isWatched(it)?'✓ Просмотрено':'○ Отметить просмотренным'}</button><a class="small-btn gold" style="text-decoration:none" target="_blank" href="${esc(it.kp_url||'#')}">Кинопоиск ↗</a></div>`)}
window.modalFav=id=>{toggleFav(id);openDetails(id)};window.modalWatched=id=>{toggleWatched(id);openDetails(id)}
function randomPick(){const pool=items.filter(x=>!isWatched(x));if(!pool.length)return;openDetails(idFor(pool[Math.floor(Math.random()*pool.length)]))}
async function tmdbSearch(q){const token=localStorage.getItem(TOKEN_KEY);if(!token)throw new Error('Сначала нужен TMDB Token. Он берётся из стабильной версии автоматически, если уже сохранён.');const r=await fetch('https://api.themoviedb.org/3/search/multi?query='+encodeURIComponent(q)+'&language=ru-RU&include_adult=false',{headers:{Authorization:'Bearer '+token,accept:'application/json'}});if(!r.ok)throw new Error('TMDB '+r.status);return r.json()}
function openAdd(){openModal(`<h2>Добавить фильм или сериал</h2><input id="tmdbQ" placeholder="Введите название"><button class="small-btn gold" id="tmdbGo">Найти в TMDB</button><div id="tmdbResults"></div>`);$('#tmdbGo').onclick=async()=>{const box=$('#tmdbResults');box.innerHTML='Ищу…';try{const d=await tmdbSearch($('#tmdbQ').value.trim());const res=(d.results||[]).filter(x=>x.media_type==='movie'||x.media_type==='tv').slice(0,8);box.innerHTML=res.map(x=>{const t=x.media_type==='movie'?'M':'S',title=x.title||x.name,year=(x.release_date||x.first_air_date||'').slice(0,4),poster=x.poster_path?'https://image.tmdb.org/t/p/w185'+x.poster_path:'';return `<div class="result"><div class="result-poster" style="${poster?`background-image:url('${poster}')`:''}"></div><div><b>${esc(title)}</b><br><small>${year||'—'} · ${t==='M'?'Фильм':'Сериал'} · ★ ${x.vote_average?Number(x.vote_average).toFixed(1):'—'}</small></div><button class="small-btn gold tmdb-add" data-json="${encodeURIComponent(JSON.stringify({title,year:year?+year:null,type:t,rating:x.vote_average?+Number(x.vote_average).toFixed(1):null,tmdb_rating:x.vote_average?+Number(x.vote_average).toFixed(1):null,desc:x.overview||'',genres:[],poster_url:poster?poster.replace('/w185','/w500'):'',tmdb_id:x.id,tmdb_type:x.media_type,kp_url:'https://www.kinopoisk.ru/index.php?kp_query='+encodeURIComponent(title)}))}">Добавить</button></div>`}).join('')||'Ничего не найдено';$$('.tmdb-add').forEach(b=>b.onclick=()=>{const it=JSON.parse(decodeURIComponent(b.dataset.json));state.addedItems=state.addedItems||[];if(!state.addedItems.some(x=>x.tmdb_id===it.tmdb_id&&x.type===it.type))state.addedItems.push(it);saveState();closeModal();rebuild()})}catch(e){box.textContent=e.message}}}
function openProfile(){openModal(`<h2>Профиль и данные</h2><p style="color:var(--muted)">Beta 1 использует тот же localStorage, что и стабильная v5.6.3. Поэтому отметки, избранное, добавленные позиции и TMDB-кэш общие для обеих версий в одном браузере.</p><div class="result"><div>🎬</div><div><b>${items.length}</b><br><small>всего позиций</small></div></div><div class="result"><div>✨</div><div><b>${Object.keys(state.tmdbMeta||{}).length}</b><br><small>TMDB-кэш</small></div></div><div class="result"><div>🔑</div><div><b>${localStorage.getItem(TOKEN_KEY)?'TMDB Token сохранён':'TMDB Token не найден'}</b></div></div>`)}
$('#search').oninput=e=>{query=e.target.value;applyFilters()};$('#sort').onchange=e=>{sortMode=e.target.value;applyFilters()};$('#randomBtn').onclick=randomPick;$('#addBtn').onclick=openAdd;$('#deskAdd').onclick=openAdd;$('#profileBtn').onclick=openProfile;$('#mobileProfile').onclick=openProfile;$('#searchBtn').onclick=()=>{$('#search').focus();$('#search').scrollIntoView({behavior:'smooth',block:'center'})};$('#topSearch').onclick=$('#searchBtn').onclick;$('#sentinel').onclick=()=>{renderLimit+=30;renderList()};$('[data-scroll="list"]').onclick=()=>$('#listSection').scrollIntoView({behavior:'smooth'});$('#ratingFilter').onclick=()=>{sortMode='rating';$('#sort').value='rating';typeFilter='all';stateFilter='all';applyFilters();$('#listSection').scrollIntoView({behavior:'smooth'})}
$$('[data-type]').forEach(b=>b.onclick=()=>{$$('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');typeFilter=b.dataset.type;applyFilters()});$$('[data-state]').forEach(b=>b.onclick=()=>{const was=b.classList.contains('active');$$('[data-state]').forEach(x=>x.classList.remove('active'));stateFilter=was?'all':b.dataset.state;if(!was)b.classList.add('active');applyFilters()});$$('[data-nav="list"]').forEach(b=>b.onclick=()=>$('#listSection').scrollIntoView({behavior:'smooth'}));$$('[data-nav="home"]').forEach(b=>b.onclick=()=>scrollTo({top:0,behavior:'smooth'}))
;(async()=>{try{loadState();BASE=await fetchBase();rebuild()}catch(e){$('#heroCount').textContent='Ошибка загрузки';$('#list').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}})()
</script>
</body>
