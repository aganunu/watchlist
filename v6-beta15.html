<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Кино-менеджер</title>
<script>
(() => {
  'use strict';
  const target = new URL('./', location.href);
  target.search = location.search;
  target.hash = location.hash;
  location.replace(target.href);
})();
</script>
</head>
<body>
<p><a id="continueLink" href="./">Открыть Кино-менеджер</a></p>
<script>
document.getElementById('continueLink').href = './' + location.search + location.hash;
</script>
</body>
</html>
